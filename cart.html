<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Zi | Checkout</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700;900&display=swap');
        :root { --zi-yellow: #FFC107; --zi-dark: #0F0F0F; }
        html, body, * { cursor: url('https://cdn-icons-png.flaticon.com/24/1046/1046761.png'), auto !important; }
        body { font-family: 'Inter', sans-serif; background-color: #FAF9F6; min-h-screen; }
        .bg-grid { background-image: linear-gradient(#f0e9d5 1px, transparent 1px), linear-gradient(90deg, #f0e9d5 1px, transparent 1px); background-size: 40px 40px; }
        .font-heading { font-family: 'Archivo Black', sans-serif; }
        .switch-toggle { display: flex; background: #eee; padding: 4px; border-radius: 20px; }
        .switch-btn { flex: 1; padding: 10px; border-radius: 16px; font-weight: 900; transition: 0.3s; }
        .switch-btn.active { background: var(--zi-yellow); color: black; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #summary-items::-webkit-scrollbar { width: 4px; }
        #summary-items::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="bg-grid min-h-screen">

    <!-- NAV WITH LOGO.JPEG -->
    <nav class="flex justify-between items-center px-10 py-4 sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-zinc-200">
        <a href="index.html" class="flex items-center gap-2">
            <img src="logo.jpeg" alt="Zi Logo" class="h-12 w-12 rounded-2xl shadow-sm object-cover border border-yellow-200">
        </a>
        <a href="menu.html" class="font-bold text-xs uppercase tracking-widest border-b-2 border-black hover:text-yellow-600 transition">Back to Menu</a>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12">
        <h1 class="text-6xl font-heading uppercase italic tracking-tighter mb-10 text-black">Review <span class="text-yellow-500">Order</span></h1>

        <div class="grid lg:grid-cols-2 gap-12">
            
            <div class="space-y-6">
                <div class="bg-white p-8 rounded-[40px] shadow-xl border border-zinc-100">
                    <h3 class="font-heading text-xl uppercase mb-6 italic">How do you want it?</h3>
                    <div class="switch-toggle mb-8">
                        <button onclick="setMethod('pickup')" id="btn-pickup" class="switch-btn active uppercase text-xs">Pick Up</button>
                        <button onclick="setMethod('delivery')" id="btn-delivery" class="switch-btn uppercase text-xs">Delivery</button>
                    </div>

                    <div id="location-box" class="hidden space-y-4">
                        <label class="block font-black uppercase text-[10px] tracking-widest">Select Area</label>
                        <select id="area-select" class="w-full p-4 rounded-2xl bg-zinc-100 border-2 border-transparent focus:border-yellow-400 outline-none font-bold transition">
                            <option value="">Choose neighborhood...</option>
                            <option value="umm_ramool">Umm Ramool (Local Delivery)</option>
                            <option value="other">Outside Umm Ramool</option>
                        </select>
                        <div class="bg-yellow-50 p-4 rounded-2xl border border-yellow-100">
                            <p class="text-[10px] text-yellow-700 font-bold uppercase leading-tight">📍 Delivery is exclusively for Umm Ramool to maintain the Gold Standard crunch.</p>
                        </div>
                    </div>

                    <div id="pickup-box" class="bg-zinc-50 p-6 rounded-3xl border border-zinc-100">
                        <p class="font-bold text-sm text-black uppercase italic">Zi Umm Ramool Branch</p>
                        <p class="text-[10px] uppercase text-zinc-400 mt-2 tracking-widest">Ready for collection in 15-20 mins</p>
                    </div>
                </div>
            </div>

            <div class="bg-black text-white p-10 rounded-[50px] shadow-2xl flex flex-col justify-between min-h-[500px]">
                <div>
                    <h3 class="font-heading text-2xl uppercase mb-8 italic text-yellow-400 border-b border-zinc-800 pb-4">Your Items</h3>
                    <div id="summary-items" class="space-y-4 max-h-[350px] overflow-y-auto pr-2">
                        <!-- Items injected here -->
                    </div>
                </div>

                <div class="mt-12 pt-8 border-t border-zinc-800">
                    <div class="flex justify-between items-center font-heading text-3xl uppercase italic mb-8 text-white">
                        <span>Total</span>
                        <span id="final-total" class="text-yellow-400">AED 0</span>
                    </div>
                    <button onclick="completeOrder()" class="w-full bg-yellow-400 text-black py-6 rounded-2xl font-black uppercase tracking-tighter text-lg hover:bg-white transition-all transform hover:scale-[1.02]">
                        Send to WhatsApp
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        let orderMethod = 'pickup';

        function loadCart() {
            const cartData = localStorage.getItem('zi_cart');
            const summaryDiv = document.getElementById('summary-items');
            const totalEl = document.getElementById('final-total');
            
            if (!cartData || JSON.parse(cartData).length === 0) {
                summaryDiv.innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-zinc-500 font-bold uppercase text-xs tracking-widest italic mb-6">Bag is currently empty</p>
                        <a href="menu.html" class="bg-yellow-400 text-black px-8 py-3 rounded-full text-[10px] font-black uppercase tracking-tighter hover:bg-white transition-all inline-block cursor-pointer">
                            Go add some crunch
                        </a>
                    </div>
                `;
                totalEl.innerText = 'AED 0';
                return;
            }

            const cart = JSON.parse(cartData);
            let total = 0;
            summaryDiv.innerHTML = ''; 

            cart.forEach((item, index) => {
                total += item.price;
                summaryDiv.innerHTML += `
                    <div class="flex justify-between items-center group bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800">
                        <div class="flex flex-col">
                            <span class="font-black text-sm uppercase italic tracking-tight">${item.name}</span>
                            <span class="text-[10px] text-yellow-500 uppercase font-bold">AED ${item.price}</span>
                        </div>
                        <button onclick="removeItem(${index})" class="text-[9px] font-black uppercase text-red-500 bg-red-500/10 px-3 py-1 rounded-full hover:bg-red-500 hover:text-white transition">Remove</button>
                    </div>
                `;
            });

            totalEl.innerText = `AED ${total}`;
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('zi_cart'));
            cart.splice(index, 1); 
            localStorage.setItem('zi_cart', JSON.stringify(cart));
            loadCart(); 
        }

        function setMethod(method) {
            orderMethod = method;
            const pickupBtn = document.getElementById('btn-pickup');
            const deliveryBtn = document.getElementById('btn-delivery');
            const pickupBox = document.getElementById('pickup-box');
            const locationBox = document.getElementById('location-box');

            if (method === 'delivery') {
                deliveryBtn.classList.add('active');
                pickupBtn.classList.remove('active');
                locationBox.classList.remove('hidden');
                pickupBox.classList.add('hidden');
            } else {
                pickupBtn.classList.add('active');
                deliveryBtn.classList.remove('active');
                locationBox.classList.add('hidden');
                pickupBox.classList.remove('hidden');
            }
        }

        function completeOrder() {
            const cartData = localStorage.getItem('zi_cart');
            if (!cartData || JSON.parse(cartData).length === 0) {
                alert("Nothing in your bag yet!");
                return;
            }

            const cart = JSON.parse(cartData);
            let total = 0;
            
            let message = "🍗 *NEW ZI ORDER* 🍗\n\n";

            if (orderMethod === 'delivery') {
                const area = document.getElementById('area-select').value;
                if (!area) { alert("Please select a delivery area."); return; }
                if (area !== 'umm_ramool') {
                    alert("⚠️ Zi Delivery is currently exclusive to Umm Ramool to ensure the Gold Standard crunch. Try Pick Up!");
                    return;
                }
                message += "*Method:* Delivery (Umm Ramool)\n\n";
            } else {
                message += "*Method:* Pick Up\n\n";
            }

            message += "*Items:*\n";
            cart.forEach((item) => {
                message += `- ${item.name} (AED ${item.price})\n`;
                total += item.price;
            });
            
            message += `\n*Total:* AED ${total}\n`;
            message += "\nWaiting for confirmation!";

            const encodedMessage = encodeURIComponent(message);
            const whatsappNumber = "971501234567"; // CHANGE THIS TO YOUR ACTUAL WHATSAPP NUMBER

            const whatsappURL = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

            localStorage.removeItem('zi_cart');
            window.location.href = whatsappURL; 
        }

        window.onload = loadCart;
    </script>
</body>
</html>
