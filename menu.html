<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Zi Menu | The Gold Standard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700;900&display=swap');
        :root { --zi-yellow: #FFC107; --zi-dark: #0F0F0F; }

        html, body, * { cursor: url('https://cdn-icons-png.flaticon.com/24/1046/1046761.png'), auto !important; }
        body { font-family: 'Inter', sans-serif; background-color: #FAF9F6; scroll-behavior: smooth; }
        .bg-grid { background-image: linear-gradient(#f0e9d5 1px, transparent 1px), linear-gradient(90deg, #f0e9d5 1px, transparent 1px); background-size: 40px 40px; }
        .font-heading { font-family: 'Archivo Black', sans-serif; }

        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
        .blob { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transition: 0.5s; }
        
        /* Category button active state */
        .filter-btn.active { background-color: var(--zi-yellow); color: black; border-color: black; }
    </style>
</head>
<body class="bg-grid min-h-screen pb-20">

    <nav class="flex justify-between items-center px-10 py-6 sticky top-0 z-50 glass">
        <a href="index.html" class="text-4xl font-heading tracking-tighter uppercase">ZI<span class="text-yellow-500">.</span></a>
        <div class="flex gap-6 font-bold text-xs uppercase tracking-widest items-center">
            <a href="index.html">Home</a>
            <a href="cart.html" class="bg-black text-white px-6 py-2 rounded-full flex items-center gap-3">
                <span>Checkout</span>
                <span id="cart-count" class="bg-white text-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-black">0</span>
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 pt-16">
        <header class="mb-12">
            <h1 class="text-7xl font-heading uppercase italic tracking-tighter">THE FULL <span class="text-yellow-500">CRUNCH</span></h1>
            
            <div class="flex flex-wrap gap-4 mt-10">
                <button onclick="filterItems('all')" class="filter-btn active px-8 py-3 rounded-full font-black uppercase text-sm border-2 border-black transition">All Items</button>
                <button onclick="filterItems('broasted')" class="filter-btn bg-white border-2 border-zinc-200 px-8 py-3 rounded-full font-black uppercase text-sm text-zinc-400 hover:border-black transition">Broasted</button>
                <button onclick="filterItems('burgers')" class="filter-btn bg-white border-2 border-zinc-200 px-8 py-3 rounded-full font-black uppercase text-sm text-zinc-400 hover:border-black transition">Burgers</button>
                <button onclick="filterItems('wraps')" class="filter-btn bg-white border-2 border-zinc-200 px-8 py-3 rounded-full font-black uppercase text-sm text-zinc-400 hover:border-black transition">Wraps</button>
                <button onclick="filterItems('mojitos')" class="filter-btn bg-white border-2 border-zinc-200 px-8 py-3 rounded-full font-black uppercase text-sm text-zinc-400 hover:border-black transition">Mojitos</button>
            </div>
        </header>

        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            
            <div class="item broasted bg-white p-6 rounded-[40px] shadow-lg border border-zinc-100 group">
                <div class="bg-yellow-100 blob p-4 mb-4"><img src="https://images.unsplash.com/photo-1562967914-608f82629710?w=400" class="rounded-2xl h-40 w-full object-cover"></div>
                <h3 class="font-heading text-lg uppercase italic">Value Box</h3>
                <div class="mt-4 flex justify-between items-center"><span class="font-black">AED 24</span><button onclick="add()" class="bg-black text-white p-3 rounded-xl">Add</button></div>
            </div>

            <div class="item burgers bg-white p-6 rounded-[40px] shadow-lg border border-zinc-100 group">
                <div class="bg-red-100 blob p-4 mb-4"><img src="https://images.unsplash.com/photo-1513185158878-8d8c196b8f88?w=400" class="rounded-2xl h-40 w-full object-cover"></div>
                <h3 class="font-heading text-lg uppercase italic">Zi Monster</h3>
                <div class="mt-4 flex justify-between items-center"><span class="font-black">AED 32</span><button onclick="add()" class="bg-black text-white p-3 rounded-xl">Add</button></div>
            </div>

            <div class="item burgers bg-white p-6 rounded-[40px] shadow-lg border border-zinc-100 group">
                <div class="bg-red-100 blob p-4 mb-4"><img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" class="rounded-2xl h-40 w-full object-cover"></div>
                <h3 class="font-heading text-lg uppercase italic">Classic Crunch</h3>
                <div class="mt-4 flex justify-between items-center"><span class="font-black">AED 26</span><button onclick="add()" class="bg-black text-white p-3 rounded-xl">Add</button></div>
            </div>

            <div class="item wraps bg-white p-6 rounded-[40px] shadow-lg border border-zinc-100 group">
                <div class="bg-zinc-100 blob p-4 mb-4"><img src="https://images.unsplash.com/photo-1541544741938-0af808871cc0?w=400" class="rounded-2xl h-40 w-full object-cover"></div>
                <h3 class="font-heading text-lg uppercase italic">Spicy Wrap</h3>
                <div class="mt-4 flex justify-between items-center"><span class="font-black">AED 18</span><button onclick="add()" class="bg-black text-white p-3 rounded-xl">Add</button></div>
            </div>

            <div class="item mojitos bg-white p-6 rounded-[40px] shadow-lg border border-zinc-100 group">
                <div class="bg-blue-100 blob p-4 mb-4"><img src="https://images.unsplash.com/photo-1546173159-315724a31696?w=400" class="rounded-2xl h-40 w-full object-cover"></div>
                <h3 class="font-heading text-lg uppercase italic">Vimto Blast</h3>
                <div class="mt-4 flex justify-between items-center"><span class="font-black">AED 14</span><button onclick="add()" class="bg-black text-white p-3 rounded-xl">Add</button></div>
            </div>

            <div class="item mojitos bg-white p-6 rounded-[40px] shadow-lg border border-zinc-100 group">
                <div class="bg-purple-100 blob p-4 mb-4"><img src="https://images.unsplash.com/photo-1544145945-f904253d0c71?w=400" class="rounded-2xl h-40 w-full object-cover"></div>
                <h3 class="font-heading text-lg uppercase italic">Passion Mojito</h3>
                <div class="mt-4 flex justify-between items-center"><span class="font-black">AED 15</span><button onclick="add()" class="bg-black text-white p-3 rounded-xl">Add</button></div>
            </div>

        </div>
    </main>

    <script>
        // 1. Function to filter items
        function filterItems(category) {
            const items = document.querySelectorAll('.item');
            const buttons = document.querySelectorAll('.filter-btn');

            // Update buttons
            buttons.forEach(btn => btn.classList.remove('active', 'bg-yellow-400', 'text-black', 'border-black'));
            event.currentTarget.classList.add('active', 'bg-yellow-400', 'text-black', 'border-black');

            // Filter grid
            items.forEach(item => {
                if (category === 'all' || item.classList.contains(category)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // 2. Simple cart count
        let count = 0;
        function add() {
            count++;
            document.getElementById('cart-count').innerText = count;
        }

        // 3. Keep your custom cursor
        document.addEventListener('mousemove', (e) => {
            const cursor = 'url(https://cdn-icons-png.flaticon.com/24/1046/1046761.png), auto';
            document.body.style.cursor = cursor;
        });
    </script>
</body>
</html>
