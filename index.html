<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Zi | The Ultimate Crunch</title>
    <style>
        /* Loading Screen Styles */
        #loader {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        /* The "Chicken" Animation */
        .chicken-bucket {
            width: 100px;
            height: 100px;
            position: relative;
            background: #f3f4f6; /* Gray/Raw state */
            border-radius: 20px 20px 50px 50px;
            overflow: hidden;
            border: 4px solid #000;
        }

        .filling-gold {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to top, #d97706, #fbbf24); /* Golden Crispy Color */
            animation: cook 3s infinite ease-in-out;
        }

        @keyframes cook {
            0% { height: 0%; opacity: 0.5; }
            50% { height: 100%; opacity: 1; }
            100% { height: 0%; opacity: 0.5; } /* Loops back as requested */
        }

        .zi-red { color: #E11D48; }
        .bg-zi { background-color: #E11D48; }
    </style>
</head>
<body class="bg-stone-50 font-sans text-gray-900 overflow-hidden" id="body-content">

    <div id="loader">
        <div class="chicken-bucket">
            <div class="filling-gold"></div>
        </div>
        <h2 class="mt-6 text-2xl font-black italic tracking-tighter zi-red animate-pulse">COOKING ZI...</h2>
    </div>

    <nav class="flex justify-between items-center px-8 py-4 bg-white shadow-md sticky top-0 z-50">
        <div class="text-4xl font-black zi-red tracking-tighter italic uppercase">ZI</div>
        <div class="flex space-x-6 font-bold uppercase text-xs tracking-widest">
            <a href="#menu" class="hover:text-red-600 transition pt-2">Menu</a>
            <a href="#platforms" class="bg-zi text-white px-6 py-2 rounded-full hover:bg-black transition">Order Now</a>
        </div>
    </nav>

    <header class="relative h-[80vh] flex items-center justify-center bg-black">
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&q=80&w=2000" 
                 class="w-full h-full object-cover opacity-60" alt="Zi Chicken">
        </div>
        <div class="relative z-10 text-center text-white px-4">
            <h1 class="text-7xl md:text-9xl font-black mb-2 uppercase italic tracking-tighter">CRAVE ZI.</h1>
            <p class="text-xl md:text-2xl mb-8 font-light tracking-widest">BROASTED • BURGERS • WRAPS</p>
            <a href="#menu" class="bg-white text-black px-12 py-5 rounded-full font-black text-lg hover:scale-105 transition-transform inline-block">THE FULL MENU</a>
        </div>
    </header>

    <section id="menu" class="py-16 px-6 max-w-6xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-white p-4 rounded-3xl shadow-sm hover:shadow-xl transition">
                <img src="https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?w=500" class="rounded-2xl mb-4 w-full h-48 object-cover">
                <h3 class="font-bold italic uppercase">Zi Bucket</h3>
                <p class="text-sm text-gray-500">8pc Original Crispy</p>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm hover:shadow-xl transition">
                <img src="https://images.unsplash.com/photo-1513185158878-8d8c182b013e?w=500" class="rounded-2xl mb-4 w-full h-48 object-cover">
                <h3 class="font-bold italic uppercase">Zi Burger</h3>
                <p class="text-sm text-gray-500">The Ultimate Stack</p>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm hover:shadow-xl transition">
                <img src="https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=500" class="rounded-2xl mb-4 w-full h-48 object-cover">
                <h3 class="font-bold italic uppercase">Zi Wrap</h3>
                <p class="text-sm text-gray-500">Spicy Garlic Twister</p>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm hover:shadow-xl transition">
                <img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=500" class="rounded-2xl mb-4 w-full h-48 object-cover">
                <h3 class="font-bold italic uppercase">Zi Mojito</h3>
                <p class="text-sm text-gray-500">Signature Fresh Drink</p>
            </div>
        </div>
    </section>

    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            const body = document.getElementById('body-content');
            
            // Artificial delay so the tutors can actually see your animation!
            setTimeout(() => {
                loader.style.opacity = '0';
                body.classList.remove('overflow-hidden');
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 3500); // 3.5 seconds of "cooking"
        });
    </script>
</body>
</html>
