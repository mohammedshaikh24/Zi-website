<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>The Golden Crunch | UAE's Best Broasted</title>
</head>
<body class="bg-stone-50 font-sans text-gray-900">

    <nav class="flex justify-between items-center px-8 py-4 bg-white shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-red-600 tracking-tighter italic">GOLDEN CRUNCH</h1>
        <div class="hidden md:flex space-x-6 font-medium">
            <a href="#menu" class="hover:text-red-600 transition">Menu</a>
            <a href="#order" class="hover:text-red-600 transition text-red-600">Order Now</a>
        </div>
    </nav>

    <header class="relative h-[70vh] flex items-center justify-center bg-black overflow-hidden">
        <div class="absolute inset-0 opacity-60">
            <img src="https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?auto=format&fit=crop&q=80&w=2000" class="w-full h-full object-cover" alt="Fried Chicken">
        </div>
        <div class="relative z-10 text-center text-white px-4">
            <h2 class="text-5xl md:text-7xl font-black mb-4 uppercase italic">The Ultimate Crunch</h2>
            <p class="text-xl md:text-2xl mb-8 font-light">Broasted to perfection. Delivered in minutes.</p>
            <a href="#order" class="bg-yellow-400 text-black px-10 py-4 rounded-full font-bold text-lg hover:bg-yellow-300 transition-transform transform hover:scale-105 shadow-xl inline-block">ORDER NOW</a>
        </div>
    </header>

    <section id="order" class="py-16 bg-white text-center">
        <h3 class="text-3xl font-bold mb-10">Where would you like to order?</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-4xl mx-auto px-6">
            <a href="#" class="p-6 border rounded-2xl hover:border-red-500 hover:shadow-lg transition group">
                <div class="h-12 w-12 bg-orange-100 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <span class="text-orange-600 font-bold">T</span>
                </div>
                <p class="font-bold group-hover:text-orange-600">Talabat</p>
            </a>
            <a href="#" class="p-6 border rounded-2xl hover:border-teal-500 hover:shadow-lg transition group">
                <div class="h-12 w-12 bg-teal-100 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <span class="text-teal-600 font-bold">D</span>
                </div>
                <p class="font-bold group-hover:text-teal-600">Deliveroo</p>
            </a>
            <a href="#" class="p-6 border rounded-2xl hover:border-yellow-500 hover:shadow-lg transition group">
                <div class="h-12 w-12 bg-yellow-100 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <span class="text-yellow-600 font-bold">N</span>
                </div>
                <p class="font-bold group-hover:text-yellow-600">Noon Food</p>
            </a>
            <a href="#" class="p-6 border rounded-2xl hover:border-blue-500 hover:shadow-lg transition group">
                <div class="h-12 w-12 bg-blue-100 rounded-full mx-auto mb-4 flex items-center justify-center">
                    <span class="text-blue-600 font-bold">K</span>
                </div>
                <p class="font-bold group-hover:text-blue-600">Keeta</p>
            </a>
        </div>
    </section>

    <a href="https://wa.me/YOURNUMBER" class="fixed bottom-6 right-6 bg-green-500 text-white p-4 rounded-full shadow-2xl hover:bg-green-600 transition z-[100]">
        <span class="font-bold flex items-center">Order via WhatsApp</span>
    </a>

</body>
</html>
